---
name: Bug Report
description: Report a bug in sca.sh or SCA policy testing
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: When running sca.sh with -pdc, the script fails to parse...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `./sca.sh -pdc -f cis_ubuntu24-04.yml`
        2. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: The OS where the bug occurs.
      options:
        - Ubuntu 26.04
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Ubuntu 20.04
        - Debian 12
        - Other (specify in description)
    validations:
      required: true
  - type: input
    id: sca_version
    attributes:
      label: SCA Policy Version
      description: Which CIS benchmark policy file are you using?
      placeholder: cis_ubuntu24-04.yml (from wazuh/wazuh@master)
  - type: textarea
    id: logs
    attributes:
      label: Log Output
      description: Paste relevant log output (use -pdc -pao flags for full output).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have tested with the latest version of sca.sh
        - label: I have checked existing issues for duplicates
        - label: I have included all relevant information
