---
name: SCA Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sca-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run SCA tests (${{ matrix.policy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        policy: [cis_ubuntu24-04.yml, cis_ubuntu22-04.yml, cis_ubuntu26-04.yml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yq jq

      - name: Install wazuh-regex
        run: ./install-wazuh-regex.sh

      - name: Run SCA tests
        run: |
          ./sca.sh -pdc -f ./${{ matrix.policy }} 2>&1 | tee report.log

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-report-${{ matrix.policy }}
          path: report.log
          retention-days: 7
